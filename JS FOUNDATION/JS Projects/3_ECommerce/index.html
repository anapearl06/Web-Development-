<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNest</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🛍️ ShopNest</h1>
            <p>Simple • Clean • Elegant Shopping Experience</p>
        </header>

        <section class="products-section">

            <div class="section-title">
                <h2>Products</h2>
            </div>

            <div id="product-list">
                <!-- Products added by JS -->
            </div>

        </section>


        <section class="cart-section">

            <div class="section-title">
                <h2>🛒 Shopping Cart</h2>
            </div>

            <div id="cart-items">

                <p id="empty-cart">
                    Your cart is empty 🥲
                </p>

            </div>

            <div id="cart-total" class="hidden">

                <p>
                    Total:
                    <span id="total-price">$0.00</span>
                </p>

                <button id="checkout-btn">
                    Checkout
                </button>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
