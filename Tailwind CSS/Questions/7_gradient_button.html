<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gradient Button | Tailwind CSS</title>

    <!-- Tailwind CSS CDN -->
    <link 
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" 
        rel="stylesheet"
    >
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-950 px-6">

    <!-- Main Section -->
    <div class="relative w-full max-w-2xl overflow-hidden rounded-3xl 
                bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900
                border border-purple-500/20 shadow-2xl p-10 md:p-16">

        <!-- Background Glow 1 -->
        <div class="absolute -top-20 -left-20 w-48 h-48 
                    bg-blue-500 rounded-full opacity-20 blur-3xl">
        </div>

        <!-- Background Glow 2 -->
        <div class="absolute -bottom-20 -right-20 w-48 h-48 
                    bg-pink-500 rounded-full opacity-20 blur-3xl">
        </div>

        <!-- Content -->
        <div class="relative text-center">

            <!-- Small Badge -->
            <span class="inline-block px-4 py-1 mb-5
                         rounded-full
                         bg-white bg-opacity-10
                         border border-white border-opacity-10
                         text-sm text-purple-300">
                ✨ Tailwind CSS
            </span>

            <!-- Heading -->
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">
                Explore Something Beautiful
            </h1>

            <!-- Description -->
            <p class="text-gray-300 max-w-md mx-auto mb-8 leading-relaxed">
                A gradient button designed with smooth transitions,
                vibrant colors and modern hover effects.
            </p>

            <!-- Gradient Button -->
            <button
                class="px-4 py-2
                       text-white font-semibold
                       rounded-lg

                       bg-gradient-to-r
                       from-blue-500
                       to-pink-500

                       shadow-md

                       transition-all duration-300

                       hover:from-pink-500
                       hover:to-blue-500

                       hover:shadow-2xl
                       hover:scale-105

                       active:scale-95"
            >
                Get Started
                <span class="ml-2">→</span>
            </button>

        </div>

    </div>

</body>
</html>
