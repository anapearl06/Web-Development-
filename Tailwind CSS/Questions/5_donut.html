<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donut Shape</title>

    <!-- Tailwind CSS CDN -->
    <link 
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" 
        rel="stylesheet"
    >
</head>

<body class="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-indigo-950 flex items-center justify-center p-6">

    <!-- Main Card -->
    <div class="w-full max-w-md bg-gray-800 rounded-3xl p-10 text-center shadow-2xl border border-gray-700">

        <!-- Heading -->
        <p class="text-indigo-400 text-sm font-semibold uppercase tracking-widest mb-3">
            Tailwind CSS
        </p>

        <h1 class="text-3xl font-bold text-white mb-3">
            Donut Shape
        </h1>

        <p class="text-gray-400 text-sm mb-10">
            Creating a donut shape using circular elements and Tailwind CSS.
        </p>


        <!-- Donut Container -->
        <div class="flex justify-center">

            <!-- Outer Donut -->
            <div
                class="w-44 h-44 rounded-full
                       bg-gradient-to-br from-pink-400 via-purple-500 to-indigo-600
                       flex items-center justify-center
                       shadow-2xl
                       border-8 border-purple-400"
            >

                <!-- Donut Hole -->
                <div
                    class="w-20 h-20 rounded-full
                           bg-gray-800
                           border-8 border-gray-700
                           shadow-inner"
                >
                </div>

            </div>

        </div>


        <!-- Description -->
        <div class="mt-10">

            <div class="flex items-center justify-center gap-3">

                <span class="h-px w-12 bg-gray-700"></span>

                <span class="text-gray-500 text-xs uppercase tracking-widest">
                    Built with Tailwind
                </span>

                <span class="h-px w-12 bg-gray-700"></span>

            </div>

        </div>


        <!-- Tailwind Classes -->
        <div class="mt-6 flex justify-center gap-2 flex-wrap">

            <span class="px-3 py-1 rounded-full bg-gray-700 text-gray-300 text-xs">
                w-44
            </span>

            <span class="px-3 py-1 rounded-full bg-gray-700 text-gray-300 text-xs">
                h-44
            </span>

            <span class="px-3 py-1 rounded-full bg-gray-700 text-gray-300 text-xs">
                rounded-full
            </span>

        </div>

    </div>

</body>
</html>
