<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rotating Square | Tailwind CSS</title>

    <!-- Tailwind CSS CDN -->
    <link 
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" 
        rel="stylesheet"
    >
</head>

<body class="min-h-screen flex items-center justify-center
             bg-gray-950 px-6 overflow-hidden">

    <!-- Main Luxury Container -->
    <div class="relative w-full max-w-lg
                rounded-3xl
                bg-gradient-to-br from-red-950 via-gray-950 to-black
                border border-yellow-500 border-opacity-30
                shadow-2xl
                overflow-hidden
                p-10 md:p-14">


        <!-- Decorative Red Glow -->
        <div class="absolute -top-32 -right-32
                    w-72 h-72
                    bg-red-700
                    rounded-full
                    opacity-30
                    blur-3xl">
        </div>


        <!-- Decorative Golden Glow -->
        <div class="absolute -bottom-32 -left-32
                    w-72 h-72
                    bg-yellow-600
                    rounded-full
                    opacity-20
                    blur-3xl">
        </div>


        <!-- Golden Decorative Line -->
        <div class="absolute top-8 left-0
                    w-full h-px
                    bg-gradient-to-r
                    from-transparent
                    via-yellow-500
                    to-transparent
                    opacity-60">
        </div>


        <!-- Main Content -->
        <div class="relative text-center">


            <!-- Small Badge -->
            <div class="inline-flex items-center
                        px-4 py-2 mb-6
                        rounded-full
                        border border-yellow-500 border-opacity-30
                        bg-yellow-500 bg-opacity-5
                        text-yellow-400
                        text-xs
                        font-semibold
                        uppercase
                        tracking-widest">

                <span class="mr-2">✦</span>

                Tailwind Animation

                <span class="ml-2">✦</span>

            </div>


            <!-- Heading -->
            <h1 class="text-3xl md:text-4xl
                       font-bold
                       text-white
                       tracking-wide">

                Rotating Square

            </h1>


            <!-- Golden Divider -->
            <div class="flex items-center justify-center
                        gap-3
                        my-5">

                <div class="w-12 h-px bg-yellow-600"></div>

                <span class="text-yellow-400 text-lg">
                    ◆
                </span>

                <div class="w-12 h-px bg-yellow-600"></div>

            </div>


            <!-- Description -->
            <p class="text-gray-400
                      max-w-sm
                      mx-auto
                      text-sm
                      leading-6">

                A simple square brought to life using
                Tailwind CSS's continuous rotation animation.

            </p>


            <!-- Animation Area -->
            <div class="relative
                        flex items-center justify-center
                        h-56
                        mt-8">


                <!-- Red Outer Glow -->
                <div class="absolute
                            w-48 h-48
                            rounded-full
                            bg-red-600
                            opacity-20
                            blur-3xl">
                </div>


                <!-- Golden Outer Ring -->
                <div class="absolute
                            w-44 h-44
                            rounded-full
                            border-2
                            border-yellow-500
                            border-opacity-40">
                </div>


                <!-- Black Inner Ring -->
                <div class="absolute
                            w-36 h-36
                            rounded-full
                            border
                            border-yellow-700
                            border-opacity-60">
                </div>


                <!-- Rotating Square -->
                <div class="relative
                            w-32 h-32
                            bg-blue-500
                            border-16 border-gray-800
                            p-4
                            animate-spin
                            shadow-2xl">

                </div>

            </div>


            <!-- Bottom Golden Line -->
            <div class="flex items-center justify-center
                        mt-8">

                <div class="w-20 h-px bg-gradient-to-r
                            from-transparent to-yellow-500">
                </div>

                <span class="mx-4 text-yellow-500">
                    ✦
                </span>

                <div class="w-20 h-px bg-gradient-to-l
                            from-transparent to-yellow-500">
                </div>

            </div>


            <!-- Footer -->
            <p class="mt-5
                      text-xs
                      text-gray-500
                      uppercase
                      tracking-widest">

                Crafted with Tailwind CSS

            </p>

        </div>

    </div>

</body>
</html>
