<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind Button</title>

    <!-- Tailwind CSS CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
        rel="stylesheet"
    >
</head>

<body class="min-h-screen bg-gray-800 flex items-center justify-center px-6">

    <!-- Main Content -->
    <div class="text-center">

        <!-- Small Label -->
        <span class="
            inline-block
            text-blue-400
            text-sm
            font-semibold
            uppercase
            tracking-widest
            mb-4
        ">
            Tailwind CSS
        </span>

        <!-- Heading -->
        <h1 class="
            text-3xl
            md:text-4xl
            font-bold
            text-white
            mb-3
        ">
            Style Your Button
        </h1>

        <!-- Description -->
        <p class="
            text-gray-400
            max-w-md
            mx-auto
            mb-8
        ">
            A simple button styled with Tailwind CSS utilities
            and interactive hover effects.
        </p>

        <!-- Button -->
        <button
            class="
                bg-blue-500
                text-white
                px-8
                py-3
                rounded-xl
                font-semibold
                shadow-lg
                transition-all
                duration-300
                transform
                hover:bg-blue-700
                hover:scale-105
                hover:shadow-xl
                focus:outline-none
                focus:ring-4
                focus:ring-blue-500
                focus:ring-opacity-30
            "
        >
            Explore Tailwind
        </button>

        <!-- Small Hint -->
        <p class="
            text-pink-300
            text-xs
            mt-6
        ">
            Hover over the button ✨
        </p>

    </div>

</body>
</html>
